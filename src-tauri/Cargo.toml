[package]
name = "map-marker-editor"
version = "0.1.0"
description = "Map Marker Editor — разметка OSM-мест"
edition = "2021"

# Для rustc < 1.85: запрещаем cargo выбирать транзитивные зависимости,
# требующие resolver="3" (например, свежие cssparser/serde_derive).
# На rustc >= 1.85 cargo сам выберет "v3", если он нужен.
resolver = "1"

[lib]
name = "map_marker_editor_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
